# Headless check for the annotation tool: raster extraction, route
# manifest generation and the global_planner.route checks run on plain
# CPython with no ROS. There is no optimizer or dynamics stage in the
# route package; nothing here certifies a trajectory.
name: annotation-headless

on:
  pull_request:
  push:
    branches: [ros2-humble]

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      # Generator pins: opencv 5.x / numpy numerics define the ridge-seed
      # and golden-digest geometry, so they are pinned like the maps.
      - run: >-
          pip install "opencv-python-headless==5.*" "numpy==2.5.4"
          scipy "shapely~=2.0" "jsonschema~=4.0" pyyaml pytest pillow
      - run: >-
          TMPDIR=${{ runner.temp }}
          PYTHONPATH=planner/global_planner
          python -m pytest planner/global_planner/test/test_annotation_core.py
          planner/global_planner/test/test_annotation_ui.py
          planner/global_planner/test/test_annotation_route.py
          planner/global_planner/test/test_annotation_legality.py
          planner/global_planner/test/test_annotation_source_identity.py -q
